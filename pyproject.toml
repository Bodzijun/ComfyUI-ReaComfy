[project]
name = "comfyui-reacomfy"
description = "REAPER <-> ComfyUI bridge nodes: send audio, MIDI, text and video from REAPER, process it in ComfyUI (voice isolation, enhancement, EQ/room match, YuE2 helpers) and import results back to the timeline."
version = "0.5.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "soundfile",
  "inworld-voice-isolation>=1.0.0",
]
classifiers = [
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
restoration = ["scipy", "clearvoice"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/Bodzijun/ComfyUI-ReaComfy"
"Bug Tracker" = "https://github.com/Bodzijun/ComfyUI-ReaComfy/issues"

[tool.comfy]
PublisherId = "bogdan-sbp"
DisplayName = "ReaComfy (REAPER Bridge)"
Icon = ""
includes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
