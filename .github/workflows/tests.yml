name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
        if: runner.os != 'macOS'
      - run: python -m pip install torch torchaudio
        if: runner.os == 'macOS'
      - run: python -m pip install numpy soundfile pytest
      - run: python -m pytest -q
